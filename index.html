
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五反田K&M整体院｜ダイエットLP</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #fff;
    }

    #lp-images {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0;
    }

    #lp-images img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    #status {
      padding: 24px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <main id="lp-images"></main>
  <div id="status">画像を読み込んでいます...</div>

  <script>
    const owner = "kouichi-kk";
    const repo = "gotanda-km-lp";

    // 表示順：手書きメモの番号順
    const imageOrder = [
      "ChatGPT 画像 2026年10月3日 15_21_03.png",
      "0F107F63-35C6-4217-A33B-CEAFDAB05A10.png",
      "ChatGPT 画像 2026年10月3日 13_32_39.png",
      "BA1A822F-639D-4284-851A-32010BDD99D02.png",
      "ChatGPT 画像 2026年10月3日 13_35_57.png",
      "LINE_NOTE_260603_1.jpg",
      "LINE_NOTE_260603_2.jpg",
      "LINE_NOTE_260603_3.jpg",
      "LINE_NOTE_260603_4.jpg",
      "LINE_NOTE_260603_5.jpg",
      "LINE_NOTE_260603_6.jpg",
      "ChatGPT 画像 2026年10月3日 13_32_39.png",
      "BA1A822F-639D-4284-851A-32010BDD99D02.png",
      "ChatGPT 画像 2026年10月3日 21_55_22.png",
      "ChatGPT 画像 2026年10月3日 14_03_45.png",
      "LINE_NOTE_261003_2.jpg",
      "LINE_NOTE_261003_3.jpg",
      "ChatGPT 画像 2026年10月3日 13_32_39.png",
      "BA1A822F-639D-4284-851A-32010BDD99D02.png",
      "ChatGPT 画像 2026年10月3日 22_19_22.png",
      "ChatGPT 画像 2026年10月3日 14_03_45.png",
      "ChatGPT 画像 2026年10月3日 14_10_34.png",
      "ChatGPT 画像 2026年10月3日 22_24_13.png",
      "LPサイズ_人生最後のダイエット (1).png",
      "ChatGPT 画像 2026年10月3日 14_36_15.png",
      "ChatGPT 画像 2026年10月3日 14_54_58.png",
      "IMG_8692.png",
      "ChatGPT 画像 2026年10月3日 22_41_03.png",

      // 29番・30番：修正済み
      "ChatGPT 画像 2026年10月3日 15_12_17.png",
      "ChatGPT 画像 2026年10月3日 13_32_39.png",

      "BA1A822F-639D-4284-851A-32010BDD99D02.png",
      "ChatGPT 画像 2026年10月3日 15_14_35.png",
      "ChatGPT 画像 2026年10月3日 15_17_18.png",
      "ChatGPT 画像 2026年10月3日 23_05_12.png"
    ];

   
async function loadImages() {
  const container = document.getElementById("lp-images");
  const status = document.getElementById("status");
  const reservationImage = "BA1A822F-639D-4284-851A-32010BD99D02.png";

  try {
    const response = await fetch(
      `https://api.github.com/repos/${owner}/${repo}/contents/`
    );

    if (!response.ok) {
      throw new Error("GitHubの画像を取得できませんでした");
    }

    const files = await response.json();
    const fileMap = new Map(
      files
        .filter(file => file.type === "file")
        .map(file => [file.name, file])
    );

    const images = imageOrder.filter(
      name => name !== reservationImage
    );

    let loaded = 0;
    const missing = [];

    function addReservationButton() {
      const file = fileMap.get(reservationImage);

      if (!file) {
        missing.push(reservationImage);
        return;
      }

      const img = document.createElement("img");
      img.src = file.download_url;
      img.alt = "ホットペッパービューティー予約ボタン";
      img.style.cssText =
        "display:block;width:100%;max-width:600px;height:auto;margin:24px auto;";
      container.appendChild(img);
    }

    images.forEach((name, index) => {
      const file = fileMap.get(name);

      if (!file) {
        missing.push(name);
        return;
      }

      const img = document.createElement("img");
      img.src = file.download_url;
      img.alt = `五反田K&M整体院 LP画像 ${index + 1}`;
      img.style.cssText = "display:block;width:100%;height:auto;";
      img.loading = index < 3 ? "eager" : "lazy";
      img.decoding = "async";
      container.appendChild(img);
      loaded++;

      if (index === 0) {
        addReservationButton();
      }

      if (index === Math.floor(images.length / 2) - 1) {
        addReservationButton();
      }
    });

    addReservationButton();

    status.textContent = missing.length
      ? `画像${loaded}枚を表示中。一部の画像を確認してください。`
      : "";

    if (missing.length) {
      console.warn("見つからないファイル:", missing);
    }
  } catch (error) {
    console.error(error);
    status.textContent =
      "画像を読み込めませんでした。GitHubの設定を確認してください。";
  }
}

loadImages();
