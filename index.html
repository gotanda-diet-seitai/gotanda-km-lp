<!DOCTYPE html>

      max-width: 900px;

<body>

  <script>

      "ChatGPT 画像 2026年10月3日 13_32_39.png",

      "ChatGPT 画像 2026年10月3日 21_55_22.png",

    ];

    const lp = document.getElementById("lp");

    imageOrder.forEach((filename, index) => {
      const img = document.createElement("img");
      img.className = "lp-image";
      img.src = "./" + encodeURIComponent(filename);
      img.alt = "五反田K&M整体院の案内画像 " + (index + 1);
      img.loading = index < 3 ? "eager" : "lazy";

      img.onerror = function () {
        const error = document.createElement("div");
        error.className = "error-message";
        error.textContent =
          (index + 1) + "番目の画像を読み込めません：" + filename;
        img.replaceWith(error);
      };

      const link = document.createElement("a");

if (filename === "ChatGPT 画像 2026年10月3日 13_32_39.png") {
  link.href = "https://lin.ee/nM7suhP";
} else if (filename === "BA1A822F-639D-4284-851A-32010BD99D02.png") {
  link.href = "http://b.hpr.jp/kr/hp/H000685575";
}

if (link.href) {
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.style.display = "block";
  link.appendChild(img);
  lp.appendChild(link);
} else {
  lp.appendChild(img);
}
    });
